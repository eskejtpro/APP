  <!-- Big Acid Action Button -->
  <g transform="translate(26, 584)">
    <rect x="0" y="0" width="368" height="54" rx="4" fill="#CCFF00"/>
    <text x="184" y="33" fill="#000000" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle" font-weight="900" letter-spacing="1">LOG WORKOUT</text>
