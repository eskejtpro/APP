      <text x="21" y="17" fill="#FFFFFF" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">60S</text>

      <rect x="48" y="0" width="42" height="26" rx="3" fill="#CCFF00"/>
      <text x="69" y="17" fill="#000000" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="900">90S</text>

