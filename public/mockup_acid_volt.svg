    <text x="350" y="56" fill="#CCFF00" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="900">CHEST</text>

    <!-- Sets -->
    <g transform="translate(16, 76)">
      <!-- Set 1 -->
      <rect x="0" y="0" width="336" height="46" rx="4" fill="#1B1E26"/>
      <text x="14" y="28" fill="#717684" font-family="sans-serif" font-size="12" font-weight="900">01</text>
      <text x="54" y="30" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="900">80.0 <tspan font-size="12" fill="#717684">KG</tspan></text>
      <text x="164" y="29" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800">8 REPS</text>
      <rect x="264" y="8" width="60" height="30" rx="3" fill="#242833"/>
      <text x="294" y="27" fill="#CCFF00" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="900">DONE</text>

      <!-- Set 2 -->
      <g transform="translate(0, 54)">
        <rect x="0" y="0" width="336" height="46" rx="4" fill="#1B1E26"/>
        <text x="14" y="28" fill="#717684" font-family="sans-serif" font-size="12" font-weight="900">02</text>
        <text x="54" y="30" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="900">85.0 <tspan font-size="12" fill="#717684">KG</tspan></text>
        <text x="164" y="29" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800">8 REPS</text>
        <rect x="264" y="8" width="60" height="30" rx="3" fill="#242833"/>
        <text x="294" y="27" fill="#CCFF00" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="900">DONE</text>
      </g>

      <!-- Set 3 -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="336" height="46" rx="4" fill="#1B1E26" stroke="#CCFF00" stroke-width="1.5"/>
        <text x="14" y="28" fill="#CCFF00" font-family="sans-serif" font-size="12" font-weight="900">03</text>
        <text x="54" y="30" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="900">90.0 <tspan font-size="12" fill="#717684">KG</tspan></text>
        <text x="164" y="29" fill="#CCFF00" font-family="sans-serif" font-size="14" font-weight="900">6 TARGET</text>
        <rect x="252" y="8" width="76" height="30" rx="3" fill="#CCFF00"/>
        <text x="290" y="27" fill="#000000" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="900">CONFIRM</text>
