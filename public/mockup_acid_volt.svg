<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <!-- Phone Body Outer Bezel (Minimalist Matte Black) -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#000000" stroke="#222225" stroke-width="3.5"/>
  <rect x="14" y="14" width="392" height="832" rx="34" fill="#0D0E11"/>

  <!-- Camera Punchhole -->
  <circle cx="210" cy="32" r="5.5" fill="#000000" stroke="#18191E" stroke-width="1.5"/>

  <!-- Status Bar -->
  <text x="36" y="36" fill="#717684" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">09:41</text>
  <path d="M362 28h18a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-18a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z" fill="none" stroke="#717684" stroke-width="1.5"/>
  <rect x="364" y="30" width="12" height="6" rx="1" fill="#CCFF00"/>

  <!-- App Header / Swiss Typographic Style -->
  <g transform="translate(26, 56)">
    <text x="0" y="16" fill="#CCFF00" font-family="sans-serif" font-size="10" font-weight="900" letter-spacing="2">SWISS ATHLETIC // ACID VOLT</text>
    <text x="0" y="46" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5">PLAN PASIKA</text>
    
    <rect x="270" y="24" width="98" height="24" rx="2" fill="#181A20" stroke="#282A33"/>
    <text x="319" y="40" fill="#CCFF00" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="900">42:20 LIVE</text>
  </g>

  <!-- 7-Day Swiss Grid Strip -->
  <g transform="translate(26, 126)">
    <rect x="0" y="0" width="46" height="58" rx="4" fill="#14161B"/>
    <text x="23" y="20" fill="#717684" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="700">MO</text>
    <text x="23" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">21</text>

    <!-- Tue (Selected) -->
    <rect x="53" y="0" width="46" height="58" rx="4" fill="#CCFF00"/>
    <text x="76" y="20" fill="#000000" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="900">TU</text>
    <text x="76" y="42" fill="#000000" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="900">22</text>

    <rect x="106" y="0" width="46" height="58" rx="4" fill="#14161B"/>
    <text x="129" y="20" fill="#717684" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="700">WE</text>
    <text x="129" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">23</text>

    <rect x="159" y="0" width="46" height="58" rx="4" fill="#14161B"/>
    <text x="182" y="20" fill="#717684" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="700">TH</text>
    <text x="182" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">24</text>

    <rect x="212" y="0" width="46" height="58" rx="4" fill="#14161B"/>
    <text x="235" y="20" fill="#717684" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="700">FR</text>
    <text x="235" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">25</text>

    <rect x="265" y="0" width="46" height="58" rx="4" fill="#14161B"/>
    <text x="288" y="20" fill="#717684" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="700">SA</text>
    <text x="288" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">26</text>

