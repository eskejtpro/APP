  <!-- Swiss Bottom Nav -->
  <g transform="translate(26, 756)">
    <rect x="0" y="0" width="368" height="64" rx="4" fill="#14161B"/>
    <text x="64" y="38" fill="#CCFF00" font-family="sans-serif" font-size="12" font-weight="900">PLANS</text>
    <text x="150" y="38" fill="#717684" font-family="sans-serif" font-size="12" font-weight="700">SESSION</text>
    <text x="236" y="38" fill="#717684" font-family="sans-serif" font-size="12" font-weight="700">DATA</text>
    <text x="316" y="38" fill="#717684" font-family="sans-serif" font-size="12" font-weight="700">USER</text>
