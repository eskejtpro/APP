    <rect x="0" y="0" width="368" height="96" rx="6" fill="#14161B" stroke="#252833" stroke-width="1"/>
    <text x="18" y="26" fill="#717684" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="1">REST INTERVAL</text>
    <text x="18" y="62" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="-1">01:14 <tspan fill="#717684" font-size="16">/ 01:30</tspan></text>
    
    <g transform="translate(210, 36)">
