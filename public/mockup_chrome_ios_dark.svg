<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="chromeDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2023"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="googleBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
    <filter id="iosShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- iPhone / Xiaomi 14T Frame -->
  <rect x="5" y="5" width="410" height="850" rx="44" fill="#1C1D21" stroke="#33363F" stroke-width="3"/>
  <rect x="14" y="14" width="392" height="832" rx="36" fill="url(#chromeDarkBg)"/>

  <!-- Top Dynamic Island / Speaker Pill -->
  <rect x="150" y="24" width="120" height="22" rx="11" fill="#0A0B0D"/>
  <circle cx="250" cy="35" r="4.5" fill="#1C212B"/>

  <!-- Status Bar (iOS style) -->
  <text x="38" y="39" fill="#E8EAED" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif" font-size="12" font-weight="700">09:41</text>
  <g transform="translate(346, 28)">
    <path d="M0 8h3v4H0zm5-3h3v7H5zm5-3h3v10h-3zm5-2h3v12h-3z" fill="#E8EAED"/>
    <rect x="22" y="1" width="18" height="10" rx="3" fill="none" stroke="#E8EAED" stroke-width="1.2"/>
    <rect x="24" y="3" width="11" height="6" rx="1.5" fill="#34A853"/>
  </g>

  <!-- Top Navigation Header (Chrome iOS Style) -->
  <g transform="translate(24, 60)">
    <!-- Google 4-Color Logo dot & Title -->
    <g transform="translate(0, 4)">
      <circle cx="6" cy="6" r="5" fill="#4285F4"/>
      <circle cx="16" cy="6" r="5" fill="#EA4335"/>
      <circle cx="26" cy="6" r="5" fill="#FBBC04"/>
      <circle cx="36" cy="6" r="5" fill="#34A853"/>
    </g>
    <text x="50" y="14" fill="#9AA0A6" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">GOOGLE CHROME // iOS EDITION</text>
    <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">PlanPasika.v1</text>

    <!-- Profile Avatar right -->
    <circle cx="356" cy="32" r="18" fill="#2D3037" stroke="#4285F4" stroke-width="2"/>
    <text x="356" y="36" fill="#8AB4F8" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="800">P</text>
  </g>

  <!-- Chrome iOS "Speed Dial" / Quick Action Squircle Tiles -->
  <g transform="translate(24, 130)">
    <!-- Tile 1: Push A -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="74" rx="20" fill="#282A2F" stroke="#3C4047" stroke-width="1" filter="url(#iosShadow)"/>
      <circle cx="40" cy="30" r="16" fill="#4285F4" fill-opacity="0.2"/>
      <text x="40" y="35" fill="#8AB4F8" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="900">🏋️</text>
      <text x="40" y="60" fill="#E8EAED" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Push A</text>
    </g>

    <!-- Tile 2: Pull B -->
    <g transform="translate(96, 0)">
      <rect x="0" y="0" width="80" height="74" rx="20" fill="#282A2F" stroke="#3C4047" stroke-width="1" filter="url(#iosShadow)"/>
      <circle cx="40" cy="30" r="16" fill="#34A853" fill-opacity="0.2"/>
      <text x="40" y="35" fill="#81C995" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="900">⚡</text>
      <text x="40" y="60" fill="#E8EAED" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Pull B</text>
    </g>

    <!-- Tile 3: Legs C -->
    <g transform="translate(192, 0)">
      <rect x="0" y="0" width="80" height="74" rx="20" fill="#282A2F" stroke="#3C4047" stroke-width="1" filter="url(#iosShadow)"/>
      <circle cx="40" cy="30" r="16" fill="#FBBC04" fill-opacity="0.2"/>
      <text x="40" y="35" fill="#FDD663" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="900">🔥</text>
      <text x="40" y="60" fill="#E8EAED" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Legs C</text>
    </g>

    <!-- Tile 4: Stoper -->
    <g transform="translate(288, 0)">
      <rect x="0" y="0" width="80" height="74" rx="20" fill="#282A2F" stroke="#3C4047" stroke-width="1" filter="url(#iosShadow)"/>
      <circle cx="40" cy="30" r="16" fill="#EA4335" fill-opacity="0.2"/>
      <text x="40" y="35" fill="#F28B82" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="900">⏱️</text>
      <text x="40" y="60" fill="#E8EAED" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Stoper</text>
    </g>
  </g>

  <!-- Rest Timer Widget (Chrome iOS Card Style with Google Colors) -->
  <g transform="translate(24, 224)">
    <rect x="0" y="0" width="368" height="92" rx="22" fill="#282A2F" stroke="#3C4043" stroke-width="1" filter="url(#iosShadow)"/>
    
    <text x="18" y="26" fill="#8AB4F8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PRZERWA REGENERACYJNA (CHROME iOS)</text>
    <text x="18" y="58" fill="#FFFFFF" font-family="-apple-system, monospace, sans-serif" font-size="28" font-weight="800">01:14 <tspan fill="#9AA0A6" font-size="14">/ 01:30</tspan></text>
    
    <!-- Chrome Pill Buttons -->
    <g transform="translate(204, 34)">
      <rect x="0" y="0" width="46" height="26" rx="13" fill="#35383F" stroke="#484C55"/>
      <text x="23" y="17" fill="#E8EAED" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">60s</text>

      <rect x="52" y="0" width="46" height="26" rx="13" fill="#1A73E8"/>
      <text x="75" y="17" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">90s</text>

      <rect x="104" y="0" width="46" height="26" rx="13" fill="#35383F" stroke="#484C55"/>
      <text x="127" y="17" fill="#E8EAED" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">120s</text>
    </g>

    <!-- Google 4-Color Progress Bar -->
    <rect x="18" y="74" width="332" height="5" rx="2.5" fill="#35383F"/>
    <rect x="18" y="74" width="80" height="5" rx="2.5" fill="#4285F4"/>
    <rect x="98" y="74" width="80" height="5" rx="2.5" fill="#34A853"/>
    <rect x="178" y="74" width="60" height="5" rx="2.5" fill="#FBBC04"/>
    <rect x="238" y="74" width="30" height="5" rx="2.5" fill="#EA4335"/>
  </g>

  <!-- Workout Card: Wyciskanie sztangi (iOS Frosted Squircle) -->
  <g transform="translate(24, 332)">
    <rect x="0" y="0" width="368" height="254" rx="24" fill="#282A2F" stroke="#3C4047" stroke-width="1" filter="url(#iosShadow)"/>
    
    <text x="20" y="32" fill="#8AB4F8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ĆWICZENIE 1 Z 4</text>
    <text x="20" y="56" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Wyciskanie sztangi leżąc</text>
    
    <rect x="282" y="24" width="66" height="24" rx="12" fill="#35383F"/>
    <text x="315" y="40" fill="#8AB4F8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Klatka</text>

    <!-- Sets List -->
    <g transform="translate(16, 76)">
      <!-- Set 1 -->
      <rect x="0" y="0" width="336" height="44" rx="14" fill="#1F2023" stroke="#35383F"/>
      <text x="18" y="27" fill="#9AA0A6" font-family="sans-serif" font-size="13" font-weight="700">1</text>
      <text x="68" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">80.0 kg</text>
      <text x="162" y="27" fill="#9AA0A6" font-family="sans-serif" font-size="13" font-weight="600">8 powt.</text>
      <rect x="254" y="8" width="68" height="28" rx="14" fill="#34A853" fill-opacity="0.2"/>
      <text x="288" y="26" fill="#81C995" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">✓ GOTOWE</text>

      <!-- Set 2 -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="336" height="44" rx="14" fill="#1F2023" stroke="#35383F"/>
        <text x="18" y="27" fill="#9AA0A6" font-family="sans-serif" font-size="13" font-weight="700">2</text>
        <text x="68" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">85.0 kg</text>
        <text x="162" y="27" fill="#9AA0A6" font-family="sans-serif" font-size="13" font-weight="600">8 powt.</text>
        <rect x="254" y="8" width="68" height="28" rx="14" fill="#34A853" fill-opacity="0.2"/>
        <text x="288" y="26" fill="#81C995" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">✓ GOTOWE</text>
      </g>

      <!-- Set 3 (Active) -->
      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="336" height="46" rx="14" fill="#1F2633" stroke="#4285F4" stroke-width="1.5"/>
        <text x="18" y="28" fill="#8AB4F8" font-family="sans-serif" font-size="13" font-weight="800">3</text>
        <text x="68" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="800">90.0 kg</text>
        <text x="162" y="28" fill="#8AB4F8" font-family="sans-serif" font-size="13" font-weight="700">6 cel</text>
        
        <rect x="242" y="8" width="82" height="30" rx="15" fill="url(#googleBlueGrad)"/>
        <text x="283" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">ZATWIERDŹ</text>
      </g>
    </g>
  </g>

  <!-- Big Finalize Button -->
  <g transform="translate(24, 604)">
    <rect x="0" y="0" width="368" height="52" rx="26" fill="url(#googleBlueGrad)" filter="url(#iosShadow)"/>
    <text x="184" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle" font-weight="800" letter-spacing="0.5">ZAPISZ I ROZLICZ SESJĘ</text>
  </g>

  <!-- CHROME iOS FLOATING BOTTOM OMNIBOX & ACTION DOCK -->
  <!-- This is the exact signature UI of Google Chrome on iPhone -->
  <g transform="translate(20, 746)">
    <!-- Frosted Bottom Bar Background -->
    <rect x="0" y="0" width="380" height="74" rx="37" fill="#1F2023" stroke="#35383F" stroke-width="1.2" filter="url(#iosShadow)"/>
    
    <!-- 1. Back button (iOS chevron) -->
    <g transform="translate(24, 25)">
      <path d="M14 6l-6 6 6 6" stroke="#9AA0A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 2. Forward button -->
    <g transform="translate(68, 25)">
      <path d="M8 6l6 6-6 6" stroke="#5F6368" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 3. Central Omnibox / Search / Active Workout Pill (Chrome Signature) -->
    <g transform="translate(112, 14)">
      <rect x="0" y="0" width="156" height="46" rx="23" fill="#2D3036" stroke="#4285F4" stroke-width="1.5"/>
      <circle cx="24" cy="23" r="8" fill="#4285F4"/>
      <text x="24" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="900">G</text>
      <text x="40" y="27" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Push A • 42m</text>
      <circle cx="138" cy="23" r="3.5" fill="#34A853"/>
    </g>

    <!-- 4. Tabs Counter Badge (Chrome iOS Tab Grid Icon '[4]') -->
    <g transform="translate(286, 23)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="none" stroke="#9AA0A6" stroke-width="2"/>
      <text x="13" y="18" fill="#E8EAED" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle" font-weight="800">4</text>
    </g>

    <!-- 5. Three Dots More Menu (•••) -->
    <g transform="translate(332, 23)">
      <circle cx="8" cy="13" r="2.2" fill="#9AA0A6"/>
      <circle cx="15" cy="13" r="2.2" fill="#9AA0A6"/>
      <circle cx="22" cy="13" r="2.2" fill="#9AA0A6"/>
    </g>
  </g>
</svg>
