    <text x="20" y="56" fill="#202124" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Wyciskanie sztangi leżąc</text>
    
    <rect x="282" y="24" width="66" height="24" rx="12" fill="#E8F0FE"/>
    <text x="315" y="40" fill="#1A73E8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Klatka</text>

