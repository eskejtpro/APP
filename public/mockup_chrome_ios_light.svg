    <text x="18" y="26" fill="#1A73E8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PRZERWA REGENERACYJNA (CHROME iOS)</text>
    <text x="18" y="58" fill="#202124" font-family="monospace, sans-serif" font-size="28" font-weight="800">01:14 <tspan fill="#70757A" font-size="14">/ 01:30</tspan></text>
    
    <g transform="translate(204, 34)">
