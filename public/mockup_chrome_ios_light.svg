    <g transform="translate(16, 76)">
      <rect x="0" y="0" width="336" height="44" rx="14" fill="#F8F9FA"/>
      <text x="18" y="27" fill="#70757A" font-family="sans-serif" font-size="13" font-weight="700">1</text>
      <text x="68" y="27" fill="#202124" font-family="sans-serif" font-size="14" font-weight="700">80.0 kg</text>
      <text x="162" y="27" fill="#70757A" font-family="sans-serif" font-size="13" font-weight="600">8 powt.</text>
      <rect x="254" y="8" width="68" height="28" rx="14" fill="#E6F4EA"/>
      <text x="288" y="26" fill="#137333" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">✓ GOTOWE</text>

      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="336" height="44" rx="14" fill="#F8F9FA"/>
        <text x="18" y="27" fill="#70757A" font-family="sans-serif" font-size="13" font-weight="700">2</text>
        <text x="68" y="27" fill="#202124" font-family="sans-serif" font-size="14" font-weight="700">85.0 kg</text>
        <text x="162" y="27" fill="#70757A" font-family="sans-serif" font-size="13" font-weight="600">8 powt.</text>
        <rect x="254" y="8" width="68" height="28" rx="14" fill="#E6F4EA"/>
        <text x="288" y="26" fill="#137333" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">✓ GOTOWE</text>
      </g>

      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="336" height="46" rx="14" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
        <text x="18" y="28" fill="#1A73E8" font-family="sans-serif" font-size="13" font-weight="800">3</text>
        <text x="68" y="28" fill="#202124" font-family="sans-serif" font-size="15" font-weight="800">90.0 kg</text>
        <text x="162" y="28" fill="#1A73E8" font-family="sans-serif" font-size="13" font-weight="700">6 cel</text>
        
        <rect x="242" y="8" width="82" height="30" rx="15" fill="#1A73E8"/>
        <text x="283" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">ZATWIERDŹ</text>
      </g>
    </g>
  </g>

  <!-- Big Finalize Button -->
  <g transform="translate(24, 604)">
    <rect x="0" y="0" width="368" height="52" rx="26" fill="url(#lightGoogleBlue)" filter="url(#cardShadowLight)"/>
    <text x="184" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle" font-weight="800">ZAPISZ I ROZLICZ SESJĘ</text>
