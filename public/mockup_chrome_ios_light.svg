      <circle cx="40" cy="30" r="16" fill="#FEF7E0"/>
      <text x="40" y="35" fill="#B06000" font-family="sans-serif" font-size="15" text-anchor="middle">🔥</text>
      <text x="40" y="60" fill="#202124" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Legs C</text>
