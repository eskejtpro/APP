      <text x="23" y="17" fill="#5F6368" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">60s</text>

      <rect x="52" y="0" width="46" height="26" rx="13" fill="#1A73E8"/>
      <text x="75" y="17" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">90s</text>

      <rect x="104" y="0" width="46" height="26" rx="13" fill="#F1F3F4"/>
      <text x="127" y="17" fill="#5F6368" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">120s</text>
