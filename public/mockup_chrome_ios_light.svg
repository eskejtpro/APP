      <text x="40" y="35" fill="#137333" font-family="sans-serif" font-size="15" text-anchor="middle">⚡</text>
      <text x="40" y="60" fill="#202124" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Pull B</text>
