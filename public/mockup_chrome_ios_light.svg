  </defs>

  <!-- Frame White / Silver -->
  <rect x="5" y="5" width="410" height="850" rx="44" fill="#E8EAED" stroke="#D1D5DB" stroke-width="3"/>
  <rect x="14" y="14" width="392" height="832" rx="36" fill="#F1F3F4"/>

  <!-- Top Dynamic Island -->
  <rect x="150" y="24" width="120" height="22" rx="11" fill="#000000"/>
  <circle cx="250" cy="35" r="4.5" fill="#1C1D21"/>

  <!-- Status Bar (iOS dark text) -->
  <text x="38" y="39" fill="#202124" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">09:41</text>
  <g transform="translate(346, 28)">
    <path d="M0 8h3v4H0zm5-3h3v7H5zm5-3h3v10h-3zm5-2h3v12h-3z" fill="#202124"/>
    <rect x="22" y="1" width="18" height="10" rx="3" fill="none" stroke="#202124" stroke-width="1.2"/>
    <rect x="24" y="3" width="11" height="6" rx="1.5" fill="#34A853"/>
  </g>

  <!-- Header Chrome iOS Light -->
  <g transform="translate(24, 60)">
    <g transform="translate(0, 4)">
      <circle cx="6" cy="6" r="5" fill="#4285F4"/>
      <circle cx="16" cy="6" r="5" fill="#EA4335"/>
      <circle cx="26" cy="6" r="5" fill="#FBBC04"/>
      <circle cx="36" cy="6" r="5" fill="#34A853"/>
    </g>
    <text x="50" y="14" fill="#5F6368" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CHROME iOS // PURE CLEAN</text>
    <text x="0" y="44" fill="#202124" font-family="-apple-system, sans-serif" font-size="22" font-weight="900">PlanPasika.v1</text>

    <!-- Profile -->
    <circle cx="356" cy="32" r="18" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
    <text x="356" y="36" fill="#1A73E8" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="800">P</text>
  </g>

  <!-- Speed Dial Squircle Buttons Light -->
  <g transform="translate(24, 130)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="74" rx="20" fill="#FFFFFF" filter="url(#cardShadowLight)"/>
      <circle cx="40" cy="30" r="16" fill="#E8F0FE"/>
      <text x="40" y="35" fill="#1A73E8" font-family="sans-serif" font-size="15" text-anchor="middle">🏋️</text>
      <text x="40" y="60" fill="#202124" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Push A</text>
    </g>

    <g transform="translate(96, 0)">
