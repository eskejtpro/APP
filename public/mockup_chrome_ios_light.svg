    <!-- Omnibox Pill -->
    <g transform="translate(112, 14)">
      <rect x="0" y="0" width="156" height="46" rx="23" fill="#F1F3F4" stroke="#1A73E8" stroke-width="1.5"/>
      <circle cx="24" cy="23" r="8" fill="#1A73E8"/>
      <text x="24" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="900">G</text>
      <text x="40" y="27" fill="#202124" font-family="sans-serif" font-size="12" font-weight="700">Push A • 42m</text>
      <circle cx="138" cy="23" r="3.5" fill="#34A853"/>
    </g>

    <!-- Tab grid [4] -->
    <g transform="translate(286, 23)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="none" stroke="#5F6368" stroke-width="2"/>
      <text x="13" y="18" fill="#202124" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="800">4</text>
    </g>

    <!-- More (•••) -->
    <g transform="translate(332, 23)">
      <circle cx="8" cy="13" r="2.2" fill="#5F6368"/>
      <circle cx="15" cy="13" r="2.2" fill="#5F6368"/>
      <circle cx="22" cy="13" r="2.2" fill="#5F6368"/>
    </g>
  </g>
</svg>
