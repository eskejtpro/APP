<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="googleBlueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
    <filter id="oledGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4285F4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Frame Xiaomi 14T Frame Pitch Black OLED -->
  <rect x="5" y="5" width="410" height="850" rx="44" fill="#000000" stroke="#252A36" stroke-width="3"/>
  <rect x="14" y="14" width="392" height="832" rx="36" fill="#000000"/>

  <!-- Top Speaker / Dynamic Island -->
  <rect x="150" y="24" width="120" height="22" rx="11" fill="#0A0A0C"/>
  <circle cx="250" cy="35" r="4.5" fill="#14171F"/>

  <!-- Status Bar -->
  <text x="38" y="39" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">09:41</text>
  <g transform="translate(346, 28)">
    <path d="M0 8h3v4H0zm5-3h3v7H5zm5-3h3v10h-3zm5-2h3v12h-3z" fill="#FFFFFF"/>
    <rect x="22" y="1" width="18" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="24" y="3" width="11" height="6" rx="1.5" fill="#34A853"/>
  </g>

  <!-- Header Chrome iOS OLED -->
  <g transform="translate(24, 60)">
    <g transform="translate(0, 4)">
      <circle cx="6" cy="6" r="5" fill="#4285F4"/>
      <circle cx="16" cy="6" r="5" fill="#EA4335"/>
      <circle cx="26" cy="6" r="5" fill="#FBBC04"/>
      <circle cx="36" cy="6" r="5" fill="#34A853"/>
    </g>
    <text x="50" y="14" fill="#4285F4" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CHROME iOS // OLED 144Hz</text>
    <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="22" font-weight="900">PlanPasika • D-1</text>

    <!-- Google Search Pill in Header -->
    <rect x="220" y="18" width="150" height="32" rx="16" fill="#11141C" stroke="#252A36"/>
    <text x="236" y="38" fill="#4285F4" font-family="sans-serif" font-size="13" font-weight="800">🔍</text>
    <text x="256" y="38" fill="#8892B0" font-family="sans-serif" font-size="11" font-weight="600">Szukaj ćwiczeń</text>
  </g>

  <!-- Chrome Speed Dial on True Black -->
  <g transform="translate(24, 130)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="74" rx="22" fill="#0D1017" stroke="#1F2636" stroke-width="1.2"/>
      <circle cx="40" cy="30" r="16" fill="#4285F4" fill-opacity="0.2"/>
      <text x="40" y="35" fill="#4285F4" font-family="sans-serif" font-size="15" text-anchor="middle">🏋️</text>
      <text x="40" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Push A</text>
    </g>

    <g transform="translate(96, 0)">
      <rect x="0" y="0" width="80" height="74" rx="22" fill="#0D1017" stroke="#1F2636" stroke-width="1.2"/>
      <circle cx="40" cy="30" r="16" fill="#34A853" fill-opacity="0.2"/>
      <text x="40" y="35" fill="#34A853" font-family="sans-serif" font-size="15" text-anchor="middle">⚡</text>
      <text x="40" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Pull B</text>
    </g>

    <g transform="translate(192, 0)">
      <rect x="0" y="0" width="80" height="74" rx="22" fill="#0D1017" stroke="#1F2636" stroke-width="1.2"/>
      <circle cx="40" cy="30" r="16" fill="#FBBC04" fill-opacity="0.2"/>
      <text x="40" y="35" fill="#FBBC04" font-family="sans-serif" font-size="15" text-anchor="middle">🔥</text>
      <text x="40" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Legs C</text>
    </g>

    <g transform="translate(288, 0)">
      <rect x="0" y="0" width="80" height="74" rx="22" fill="#0D1017" stroke="#1F2636" stroke-width="1.2"/>
      <circle cx="40" cy="30" r="16" fill="#EA4335" fill-opacity="0.2"/>
      <text x="40" y="35" fill="#EA4335" font-family="sans-serif" font-size="15" text-anchor="middle">⏱️</text>
      <text x="40" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Stoper</text>
    </g>
  </g>

  <!-- Rest Timer Widget (OLED Chrome Pill) -->
  <g transform="translate(24, 224)">
    <rect x="0" y="0" width="368" height="92" rx="24" fill="#080B10" stroke="#1C2433" stroke-width="1.5"/>
    <text x="18" y="26" fill="#4285F4" font-family="sans-serif" font-size="11" font-weight="800">⏱️ ASYSTENT ODPOCZYNKU</text>
    <text x="18" y="58" fill="#FFFFFF" font-family="monospace" font-size="28" font-weight="900">01:14 <tspan fill="#64748B" font-size="14">/ 01:30</tspan></text>
    
    <g transform="translate(204, 34)">
      <rect x="0" y="0" width="46" height="26" rx="13" fill="#131924" stroke="#253247"/>
      <text x="23" y="17" fill="#8892B0" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">60s</text>

      <rect x="52" y="0" width="46" height="26" rx="13" fill="#4285F4" filter="url(#oledGlow)"/>
      <text x="75" y="17" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">90s</text>

      <rect x="104" y="0" width="46" height="26" rx="13" fill="#131924" stroke="#253247"/>
      <text x="127" y="17" fill="#8892B0" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">120s</text>
    </g>

    <!-- Progress bar -->
    <rect x="18" y="74" width="332" height="5" rx="2.5" fill="#141B26"/>
    <rect x="18" y="74" width="240" height="5" rx="2.5" fill="#4285F4" filter="url(#oledGlow)"/>
  </g>

  <!-- Workout Card -->
  <g transform="translate(24, 332)">
    <rect x="0" y="0" width="368" height="254" rx="24" fill="#080B10" stroke="#1C2433" stroke-width="1.5"/>
    <text x="20" y="32" fill="#4285F4" font-family="sans-serif" font-size="11" font-weight="800">ĆWICZENIE 1 Z 4</text>
    <text x="20" y="56" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="900">Wyciskanie sztangi leżąc</text>
    
    <rect x="282" y="24" width="66" height="24" rx="12" fill="#131924" stroke="#4285F4" stroke-width="1"/>
    <text x="315" y="40" fill="#4285F4" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700">Klatka</text>

    <!-- Sets List -->
    <g transform="translate(16, 76)">
      <rect x="0" y="0" width="336" height="44" rx="14" fill="#0E131C" stroke="#1C2638"/>
      <text x="18" y="27" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="700">1</text>
      <text x="68" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800">80.0 kg</text>
      <text x="162" y="27" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="600">8 powt.</text>
      <rect x="254" y="8" width="68" height="28" rx="14" fill="#34A853" fill-opacity="0.2" stroke="#34A853" stroke-width="1"/>
      <text x="288" y="26" fill="#34A853" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">✓ GOTOWE</text>

      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="336" height="44" rx="14" fill="#0E131C" stroke="#1C2638"/>
        <text x="18" y="27" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="700">2</text>
        <text x="68" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800">85.0 kg</text>
        <text x="162" y="27" fill="#64748B" font-family="sans-serif" font-size="13" font-weight="600">8 powt.</text>
        <rect x="254" y="8" width="68" height="28" rx="14" fill="#34A853" fill-opacity="0.2" stroke="#34A853" stroke-width="1"/>
        <text x="288" y="26" fill="#34A853" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">✓ GOTOWE</text>
      </g>

      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="336" height="46" rx="14" fill="#0F1726" stroke="#4285F4" stroke-width="1.8"/>
        <text x="18" y="28" fill="#4285F4" font-family="sans-serif" font-size="13" font-weight="900">3</text>
        <text x="68" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="900">90.0 kg</text>
        <text x="162" y="28" fill="#FBBC04" font-family="sans-serif" font-size="13" font-weight="800">6 cel</text>
        
        <rect x="242" y="8" width="82" height="30" rx="15" fill="#4285F4" filter="url(#oledGlow)"/>
        <text x="283" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="900">ZATWIERDŹ</text>
      </g>
    </g>
  </g>

  <!-- Big Finalize Button -->
  <g transform="translate(24, 604)">
    <rect x="0" y="0" width="368" height="52" rx="26" fill="url(#googleBlueGrad2)" filter="url(#oledGlow)"/>
    <text x="184" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="900" letter-spacing="1">ZAPISZ I ROZLICZ TRENING</text>
  </g>

  <!-- CHROME iOS FLOATING BOTTOM OMNIBOX DOCK -->
  <g transform="translate(20, 746)">
    <rect x="0" y="0" width="380" height="74" rx="37" fill="#0C1017" stroke="#253247" stroke-width="1.5"/>
    
    <g transform="translate(24, 25)">
      <path d="M14 6l-6 6 6 6" stroke="#8892B0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <g transform="translate(68, 25)">
      <path d="M8 6l6 6-6 6" stroke="#48546A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Omnibox Pill with 4 Google dots -->
    <g transform="translate(112, 14)">
      <rect x="0" y="0" width="156" height="46" rx="23" fill="#141B26" stroke="#4285F4" stroke-width="1.5"/>
      <circle cx="20" cy="23" r="6" fill="#4285F4"/>
      <text x="34" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">Push A • 42m</text>
      <circle cx="140" cy="23" r="3.5" fill="#34A853"/>
    </g>

    <!-- Tab grid [4] -->
    <g transform="translate(286, 23)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="none" stroke="#8892B0" stroke-width="2"/>
      <text x="13" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="900">4</text>
    </g>

    <!-- More (•••) -->
    <g transform="translate(332, 23)">
      <circle cx="8" cy="13" r="2.2" fill="#8892B0"/>
      <circle cx="15" cy="13" r="2.2" fill="#8892B0"/>
      <circle cx="22" cy="13" r="2.2" fill="#8892B0"/>
    </g>
  </g>
</svg>
