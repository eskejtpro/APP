<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="neonLimeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#60EFFF"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Phone Body Outer Bezel (Xiaomi 14T style) -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#0A0D14" stroke="#1E2738" stroke-width="3.5"/>
  <rect x="14" y="14" width="392" height="832" rx="34" fill="url(#cyberBg)"/>

  <!-- Camera Punchhole -->
  <circle cx="210" cy="32" r="5.5" fill="#000000" stroke="#1A202C" stroke-width="1.5"/>

  <!-- Status Bar -->
  <text x="36" y="36" fill="#A0AEC0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">09:41</text>
  <path d="M362 28h18a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-18a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z" fill="none" stroke="#A0AEC0" stroke-width="1.5"/>
  <rect x="364" y="30" width="12" height="6" rx="1" fill="#00FF87"/>

  <!-- App Header / Brand -->
  <g transform="translate(26, 56)">
    <text x="0" y="18" fill="#64748B" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.5">PLANPASIKA.V1 // STEALTH-OLED</text>
    <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">Trening Dnia</text>
    
    <!-- Pulse badge -->
    <rect x="260" y="24" width="105" height="24" rx="12" fill="#00FF87" fill-opacity="0.12" stroke="#00FF87" stroke-width="1"/>
    <circle cx="274" cy="36" r="3.5" fill="#00FF87" filter="url(#neonGlow)"/>
    <text x="284" y="40" fill="#00FF87" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">AKTYWNA SESJA</text>
  </g>

  <!-- 7-Day Calendar Strip -->
  <g transform="translate(26, 126)">
    <!-- Mon -->
    <rect x="0" y="0" width="46" height="64" rx="12" fill="#0D111A" stroke="#1E2738" stroke-width="1"/>
    <text x="23" y="22" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">PON</text>
    <text x="23" y="42" fill="#94A3B8" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">21</text>
    <circle cx="23" cy="53" r="2" fill="#00FF87"/>

    <!-- Tue (Selected) -->
    <rect x="53" y="0" width="46" height="64" rx="12" fill="#001F14" stroke="#00FF87" stroke-width="1.8" filter="url(#neonGlow)"/>
    <text x="76" y="22" fill="#00FF87" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">WT</text>
    <text x="76" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">22</text>
    <circle cx="76" cy="53" r="3" fill="#00FF87"/>

    <!-- Wed -->
    <rect x="106" y="0" width="46" height="64" rx="12" fill="#0D111A" stroke="#1E2738" stroke-width="1"/>
    <text x="129" y="22" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">ŚR</text>
    <text x="129" y="42" fill="#94A3B8" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">23</text>

    <!-- Thu -->
    <rect x="159" y="0" width="46" height="64" rx="12" fill="#0D111A" stroke="#1E2738" stroke-width="1"/>
    <text x="182" y="22" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">CZW</text>
    <text x="182" y="42" fill="#94A3B8" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">24</text>
    <circle cx="182" cy="53" r="2" fill="#60EFFF"/>

    <!-- Fri -->
    <rect x="212" y="0" width="46" height="64" rx="12" fill="#0D111A" stroke="#1E2738" stroke-width="1"/>
    <text x="235" y="22" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">PT</text>
    <text x="235" y="42" fill="#94A3B8" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">25</text>

    <!-- Sat -->
    <rect x="265" y="0" width="46" height="64" rx="12" fill="#0D111A" stroke="#1E2738" stroke-width="1"/>
    <text x="288" y="22" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">SOB</text>
    <text x="288" y="42" fill="#94A3B8" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">26</text>

    <!-- Sun -->
    <rect x="318" y="0" width="46" height="64" rx="12" fill="#0D111A" stroke="#1E2738" stroke-width="1"/>
    <text x="341" y="22" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">ND</text>
    <text x="341" y="42" fill="#94A3B8" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">27</text>
  </g>

  <!-- Rest Timer Widget (High-tech Laser Gauge) -->
  <g transform="translate(26, 206)">
    <rect x="0" y="0" width="368" height="96" rx="18" fill="#070A10" stroke="#182234" stroke-width="1.2"/>
    
    <!-- Title & Timer -->
    <text x="18" y="26" fill="#00E5FF" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">⚡ ODPOWIEDZIALNY ODPOCZYNEK</text>
    <text x="18" y="60" fill="#FFFFFF" font-family="monospace" font-size="28" font-weight="900" letter-spacing="2">01:14<tspan fill="#64748B" font-size="14"> / 01:30</tspan></text>
    
    <!-- Quick Presets -->
    <g transform="translate(200, 36)">
      <rect x="0" y="0" width="36" height="24" rx="6" fill="#0F172A" stroke="#1E293B"/>
      <text x="18" y="16" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">60s</text>

      <rect x="42" y="0" width="36" height="24" rx="6" fill="#00FF87" fill-opacity="0.2" stroke="#00FF87"/>
      <text x="60" y="16" fill="#00FF87" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">90s</text>

      <rect x="84" y="0" width="36" height="24" rx="6" fill="#0F172A" stroke="#1E293B"/>
      <text x="102" y="16" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">120s</text>

      <rect x="126" y="0" width="28" height="24" rx="6" fill="#0F172A" stroke="#1E293B"/>
      <text x="140" y="16" fill="#60EFFF" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="700">⏸</text>
    </g>

    <!-- Progress bar glow -->
    <rect x="18" y="76" width="332" height="5" rx="2.5" fill="#151E2E"/>
    <rect x="18" y="76" width="270" height="5" rx="2.5" fill="url(#neonLimeGrad)" filter="url(#neonGlow)"/>
  </g>

  <!-- Exercise Card: Wyciskanie sztangi -->
  <g transform="translate(26, 318)">
    <rect x="0" y="0" width="368" height="246" rx="20" fill="#070A10" stroke="#1C273C" stroke-width="1.2"/>
    
    <!-- Exercise Header -->
    <text x="20" y="30" fill="#00FF87" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1">ĆWICZENIE 1 Z 4</text>
    <text x="20" y="54" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="17" font-weight="800">Wyciskanie sztangi leżąc</text>
    
    <rect x="274" y="24" width="76" height="22" rx="11" fill="#131B2A" stroke="#25354E"/>
    <text x="312" y="39" fill="#60EFFF" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">Klatka</text>

    <!-- Set Table Header -->
    <g transform="translate(20, 72)">
      <text x="10" y="10" fill="#64748B" font-family="monospace" font-size="9" font-weight="700">SERIA</text>
      <text x="80" y="10" fill="#64748B" font-family="monospace" font-size="9" font-weight="700">CIĘŻAR</text>
      <text x="160" y="10" fill="#64748B" font-family="monospace" font-size="9" font-weight="700">POWT.</text>
      <text x="270" y="10" fill="#64748B" font-family="monospace" font-size="9" font-weight="700">STATUS</text>
    </g>

    <!-- Set 1 (Completed) -->
    <g transform="translate(16, 92)">
      <rect x="0" y="0" width="336" height="42" rx="10" fill="#0D1420" stroke="#172236"/>
      <text x="20" y="26" fill="#94A3B8" font-family="monospace" font-size="13" font-weight="700">#1</text>
      <text x="84" y="26" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">80.0 kg</text>
      <text x="164" y="26" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">8 / 8</text>
      
      <rect x="264" y="7" width="60" height="28" rx="8" fill="#00FF87" fill-opacity="0.15" stroke="#00FF87" stroke-width="1.2"/>
      <text x="294" y="25" fill="#00FF87" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">✓ OK</text>
    </g>

    <!-- Set 2 (Completed) -->
    <g transform="translate(16, 140)">
      <rect x="0" y="0" width="336" height="42" rx="10" fill="#0D1420" stroke="#172236"/>
      <text x="20" y="26" fill="#94A3B8" font-family="monospace" font-size="13" font-weight="700">#2</text>
      <text x="84" y="26" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">85.0 kg</text>
      <text x="164" y="26" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">8 / 8</text>
      
      <rect x="264" y="7" width="60" height="28" rx="8" fill="#00FF87" fill-opacity="0.15" stroke="#00FF87" stroke-width="1.2"/>
      <text x="294" y="25" fill="#00FF87" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">✓ OK</text>
    </g>

    <!-- Set 3 (Current / Active) -->
    <g transform="translate(16, 188)">
      <rect x="0" y="0" width="336" height="42" rx="10" fill="#001812" stroke="#00FF87" stroke-width="1.2"/>
      <text x="20" y="26" fill="#00FF87" font-family="monospace" font-size="13" font-weight="700">#3</text>
      <text x="84" y="26" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="800">90.0 kg</text>
      <text x="164" y="26" fill="#00E5FF" font-family="monospace" font-size="14" font-weight="800">6 cel</text>
      
      <rect x="264" y="7" width="60" height="28" rx="8" fill="#00FF87" stroke="#00FF87" filter="url(#neonGlow)"/>
      <text x="294" y="25" fill="#05080E" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="900">ZATWIERDŹ</text>
    </g>
  </g>

  <!-- Floating Action Finalize Button -->
  <g transform="translate(26, 580)">
    <rect x="0" y="0" width="368" height="56" rx="16" fill="url(#neonLimeGrad)" filter="url(#neonGlow)"/>
    <text x="184" y="34" fill="#05080E" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle" font-weight="900" letter-spacing="1">ZAPISZ I ROZLICZ TRENING</text>
  </g>

  <!-- Bottom Navigation Bar (Stealth Dock) -->
  <g transform="translate(26, 756)">
    <rect x="0" y="0" width="368" height="64" rx="24" fill="#070A10" stroke="#182234" stroke-width="1.2"/>
    
    <!-- Tab 1: Plany (Active) -->
    <g transform="translate(46, 14)">
      <circle cx="16" cy="14" r="16" fill="#00FF87" fill-opacity="0.12"/>
      <path d="M10 14h12M10 9h12M10 19h8" stroke="#00FF87" stroke-width="2" stroke-linecap="round"/>
      <text x="16" y="40" fill="#00FF87" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="700">Plany</text>
    </g>

    <!-- Tab 2: Trening -->
    <g transform="translate(136, 14)">
      <path d="M10 19l4-4 4 4 4-4" stroke="#64748B" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="16" y="40" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="600">Trening</text>
    </g>

    <!-- Tab 3: Baza -->
    <g transform="translate(226, 14)">
      <path d="M9 10h14M9 15h14M9 20h14" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
      <text x="16" y="40" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="600">Baza</text>
    </g>

    <!-- Tab 4: Profil -->
    <g transform="translate(306, 14)">
      <circle cx="16" cy="12" r="5" stroke="#64748B" stroke-width="2" fill="none"/>
      <path d="M8 24c0-4 4-5 8-5s8 1 8 5" stroke="#64748B" stroke-width="2" fill="none"/>
      <text x="16" y="40" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="600">Profil</text>
    </g>
  </g>
</svg>
