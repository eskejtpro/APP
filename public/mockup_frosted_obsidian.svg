<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <radialGradient id="glassBg" cx="30%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="60%" stop-color="#090D18"/>
      <stop offset="100%" stop-color="#04060C"/>
    </radialGradient>
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24314A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#141C2C" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Phone Body Outer Bezel (Curved Deep Navy) -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#0C1220" stroke="#25324D" stroke-width="3"/>
  <rect x="14" y="14" width="392" height="832" rx="34" fill="url(#glassBg)"/>

  <!-- Camera Punchhole -->
  <circle cx="210" cy="32" r="5.5" fill="#04060C" stroke="#1A2436" stroke-width="1.5"/>

  <!-- Status Bar -->
  <text x="36" y="36" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">09:41</text>
  <path d="M362 28h18a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-18a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="364" y="30" width="12" height="6" rx="1" fill="#10B981"/>

  <!-- Glowing background orbs for frosted glass depth -->
  <circle cx="90" cy="180" r="100" fill="#6366F1" fill-opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="340" cy="360" r="120" fill="#10B981" fill-opacity="0.1" filter="url(#softGlow)"/>

  <!-- App Header -->
  <g transform="translate(26, 56)">
    <text x="0" y="18" fill="#818CF8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">FROSTED OBSIDIAN // M3 EXPRESSIVE</text>
    <text x="0" y="44" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">Plan Treningowy</text>
    
    <rect x="254" y="24" width="114" height="26" rx="13" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="270" cy="37" r="3.5" fill="#10B981"/>
    <text x="282" y="41" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">Autozapis aktywny</text>
  </g>

  <!-- 7-Day Pill Strip -->
  <g transform="translate(26, 126)">
    <rect x="0" y="0" width="46" height="66" rx="23" fill="url(#glassCard)" stroke="#334155" stroke-width="1"/>
    <text x="23" y="24" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">PON</text>
    <text x="23" y="44" fill="#CBD5E1" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">21</text>

    <!-- Tue (Selected) -->
    <rect x="53" y="0" width="46" height="66" rx="23" fill="url(#jadeGrad)" filter="url(#softGlow)"/>
    <text x="76" y="24" fill="#D1FAE5" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">WT</text>
    <text x="76" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="800">22</text>
    <circle cx="76" cy="54" r="2.5" fill="#FFFFFF"/>

    <rect x="106" y="0" width="46" height="66" rx="23" fill="url(#glassCard)" stroke="#334155" stroke-width="1"/>
    <text x="129" y="24" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">ŚR</text>
    <text x="129" y="44" fill="#CBD5E1" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">23</text>

    <rect x="159" y="0" width="46" height="66" rx="23" fill="url(#glassCard)" stroke="#334155" stroke-width="1"/>
    <text x="182" y="24" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">CZW</text>
    <text x="182" y="44" fill="#CBD5E1" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">24</text>

    <rect x="212" y="0" width="46" height="66" rx="23" fill="url(#glassCard)" stroke="#334155" stroke-width="1"/>
    <text x="235" y="24" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">PT</text>
    <text x="235" y="44" fill="#CBD5E1" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">25</text>

    <rect x="265" y="0" width="46" height="66" rx="23" fill="url(#glassCard)" stroke="#334155" stroke-width="1"/>
    <text x="288" y="24" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">SOB</text>
    <text x="288" y="44" fill="#CBD5E1" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">26</text>

    <rect x="318" y="0" width="46" height="66" rx="23" fill="url(#glassCard)" stroke="#334155" stroke-width="1"/>
    <text x="341" y="24" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">ND</text>
    <text x="341" y="44" fill="#CBD5E1" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="700">27</text>
  </g>

  <!-- Rest Timer (Frosted Card) -->
  <g transform="translate(26, 208)">
    <rect x="0" y="0" width="368" height="96" rx="24" fill="url(#glassCard)" stroke="#3B4968" stroke-width="1"/>
    <text x="20" y="26" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700">PRZERWA REGENERACYJNA</text>
    <text x="20" y="60" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">01:14 <tspan fill="#64748B" font-size="15">/ 01:30</tspan></text>
    
    <g transform="translate(200, 36)">
      <rect x="0" y="0" width="38" height="26" rx="13" fill="#1E293B" stroke="#334155"/>
      <text x="19" y="17" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">60s</text>

      <rect x="44" y="0" width="38" height="26" rx="13" fill="#10B981" fill-opacity="0.25" stroke="#10B981"/>
      <text x="63" y="17" fill="#34D399" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">90s</text>

      <rect x="88" y="0" width="38" height="26" rx="13" fill="#1E293B" stroke="#334155"/>
      <text x="107" y="17" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="600">120s</text>
    </g>

    <rect x="20" y="76" width="328" height="6" rx="3" fill="#0F172A"/>
    <rect x="20" y="76" width="245" height="6" rx="3" fill="url(#jadeGrad)"/>
  </g>

  <!-- Exercise Frosted Card -->
  <g transform="translate(26, 320)">
    <rect x="0" y="0" width="368" height="248" rx="24" fill="url(#glassCard)" stroke="#3B4968" stroke-width="1"/>
    
    <text x="22" y="32" fill="#818CF8" font-family="sans-serif" font-size="11" font-weight="700">SERIA 1 Z 4</text>
    <text x="22" y="58" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Wyciskanie sztangi leżąc</text>
    
    <rect x="270" y="24" width="76" height="24" rx="12" fill="#312E81" fill-opacity="0.4" stroke="#6366F1" stroke-width="1"/>
    <text x="308" y="40" fill="#A5B4FC" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">Klatka</text>

    <!-- Sets -->
    <g transform="translate(18, 80)">
      <rect x="0" y="0" width="332" height="42" rx="14" fill="#0F172A" fill-opacity="0.7" stroke="#1E293B"/>
      <text x="18" y="26" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="700">1</text>
      <text x="74" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">80 kg</text>
      <text x="160" y="26" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="600">8 powt.</text>
      <circle cx="294" cy="21" r="12" fill="#10B981" fill-opacity="0.2"/>
      <path d="M289 21l3 3 7-7" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round"/>

      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="332" height="42" rx="14" fill="#0F172A" fill-opacity="0.7" stroke="#1E293B"/>
        <text x="18" y="26" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="700">2</text>
        <text x="74" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">85 kg</text>
        <text x="160" y="26" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="600">8 powt.</text>
        <circle cx="294" cy="21" r="12" fill="#10B981" fill-opacity="0.2"/>
        <path d="M289 21l3 3 7-7" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="332" height="44" rx="14" fill="#06281E" stroke="#10B981" stroke-width="1.2"/>
        <text x="18" y="27" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="800">3</text>
        <text x="74" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="800">90 kg</text>
        <text x="160" y="27" fill="#6EE7B7" font-family="sans-serif" font-size="13" font-weight="700">6 cel</text>
        
        <rect x="246" y="8" width="76" height="28" rx="14" fill="url(#jadeGrad)"/>
        <text x="284" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">ZATWIERDŹ</text>
      </g>
    </g>
  </g>

  <!-- Button -->
  <g transform="translate(26, 584)">
    <rect x="0" y="0" width="368" height="54" rx="27" fill="url(#jadeGrad)" filter="url(#softGlow)"/>
    <text x="184" y="33" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle" font-weight="800">Zapisz i rozlicz trening</text>
  </g>

  <!-- Floating Nav Pill -->
  <g transform="translate(26, 756)">
    <rect x="0" y="0" width="368" height="64" rx="32" fill="url(#glassCard)" stroke="#3B4968" stroke-width="1"/>
    <text x="64" y="38" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="800">Plany</text>
    <text x="150" y="38" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Trening</text>
    <text x="236" y="38" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Baza</text>
    <text x="316" y="38" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Profil</text>
  </g>
</svg>
