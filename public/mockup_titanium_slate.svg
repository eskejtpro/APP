<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="titaniumBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161A20"/>
      <stop offset="100%" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E04006"/>
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252C36"/>
      <stop offset="100%" stop-color="#1A2027"/>
    </linearGradient>
  </defs>

  <!-- Phone Body Outer Bezel (Brushed Gunmetal) -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#1C2128" stroke="#333D4B" stroke-width="3.5"/>
  <rect x="14" y="14" width="392" height="832" rx="34" fill="url(#titaniumBg)"/>

  <!-- Camera Punchhole -->
  <circle cx="210" cy="32" r="5.5" fill="#0E1116" stroke="#252C36" stroke-width="1.5"/>

  <!-- Status Bar -->
  <text x="36" y="36" fill="#8892B0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">09:41</text>
  <path d="M362 28h18a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-18a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z" fill="none" stroke="#8892B0" stroke-width="1.5"/>
  <rect x="364" y="30" width="12" height="6" rx="1" fill="#FF5722"/>

  <!-- App Header / Industrial Brand -->
  <g transform="translate(26, 56)">
    <text x="0" y="18" fill="#FF5722" font-family="sans-serif" font-size="10" font-weight="900" letter-spacing="2">TITANIUM SLATE // HEAVY DUTY</text>
    <text x="0" y="44" fill="#ECEFF4" font-family="-apple-system, sans-serif" font-size="22" font-weight="900">PLAN TRENINGOWY</text>
    
    <rect x="250" y="24" width="118" height="24" rx="4" fill="#252D38" stroke="#3A4657" stroke-width="1"/>
    <text x="309" y="40" fill="#FF5722" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="800">ROTACJA: D-1</text>
  </g>

  <!-- 7-Day Metal Tokens Strip -->
  <g transform="translate(26, 126)">
    <!-- Days -->
    <rect x="0" y="0" width="46" height="60" rx="6" fill="#1C222B" stroke="#2C3644" stroke-width="1"/>
    <text x="23" y="20" fill="#717E94" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">PON</text>
    <text x="23" y="42" fill="#D8DEE9" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">21</text>

    <!-- Tue (Selected active) -->
    <rect x="53" y="0" width="46" height="60" rx="6" fill="#2E1C16" stroke="#FF5722" stroke-width="2"/>
    <text x="76" y="20" fill="#FF5722" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="800">WT</text>
    <text x="76" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="900">22</text>
    <rect x="68" y="52" width="16" height="3" rx="1.5" fill="#FF5722"/>

    <rect x="106" y="0" width="46" height="60" rx="6" fill="#1C222B" stroke="#2C3644" stroke-width="1"/>
    <text x="129" y="20" fill="#717E94" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">ŚR</text>
    <text x="129" y="42" fill="#D8DEE9" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">23</text>

    <rect x="159" y="0" width="46" height="60" rx="6" fill="#1C222B" stroke="#2C3644" stroke-width="1"/>
    <text x="182" y="20" fill="#717E94" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">CZW</text>
    <text x="182" y="42" fill="#D8DEE9" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">24</text>

    <rect x="212" y="0" width="46" height="60" rx="6" fill="#1C222B" stroke="#2C3644" stroke-width="1"/>
    <text x="235" y="20" fill="#717E94" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">PT</text>
    <text x="235" y="42" fill="#D8DEE9" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">25</text>

    <rect x="265" y="0" width="46" height="60" rx="6" fill="#1C222B" stroke="#2C3644" stroke-width="1"/>
    <text x="288" y="20" fill="#717E94" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">SOB</text>
    <text x="288" y="42" fill="#D8DEE9" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">26</text>

    <rect x="318" y="0" width="46" height="60" rx="6" fill="#1C222B" stroke="#2C3644" stroke-width="1"/>
    <text x="341" y="20" fill="#717E94" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">ND</text>
    <text x="341" y="42" fill="#D8DEE9" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="800">27</text>
  </g>

  <!-- Rest Timer (Industrial Gauge) -->
  <g transform="translate(26, 202)">
    <rect x="0" y="0" width="368" height="96" rx="10" fill="url(#metalPlate)" stroke="#3A4657" stroke-width="1.5"/>
    <text x="18" y="26" fill="#FF5722" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="1">PRZERWA REGENERACYJNA</text>
    <text x="18" y="60" fill="#FFFFFF" font-family="monospace" font-size="28" font-weight="900">01:14 <tspan fill="#717E94" font-size="14">/ 01:30</tspan></text>
    
    <g transform="translate(200, 36)">
      <rect x="0" y="0" width="38" height="24" rx="4" fill="#161C24" stroke="#2C3644"/>
      <text x="19" y="16" fill="#8892B0" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">60s</text>

      <rect x="44" y="0" width="38" height="24" rx="4" fill="#FF5722" stroke="#FF5722"/>
      <text x="63" y="16" fill="#FFFFFF" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="800">90s</text>

      <rect x="88" y="0" width="38" height="24" rx="4" fill="#161C24" stroke="#2C3644"/>
      <text x="107" y="16" fill="#8892B0" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700">120s</text>
    </g>

    <rect x="18" y="76" width="332" height="6" rx="3" fill="#12161D"/>
    <rect x="18" y="76" width="250" height="6" rx="3" fill="url(#copperGrad)"/>
  </g>

  <!-- Heavy Duty Exercise Card -->
  <g transform="translate(26, 314)">
    <rect x="0" y="0" width="368" height="252" rx="12" fill="url(#metalPlate)" stroke="#3A4657" stroke-width="1.5"/>
    
    <text x="18" y="30" fill="#8892B0" font-family="sans-serif" font-size="10" font-weight="800">STACJA 01 // CIĘŻAR WOLNY</text>
    <text x="18" y="56" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="900">WYCISKANIE SZTANGI LEŻĄC</text>
    
    <rect x="272" y="24" width="78" height="22" rx="4" fill="#161C24" stroke="#FF5722" stroke-width="1"/>
    <text x="311" y="39" fill="#FF5722" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="800">KLATKA</text>

    <!-- Sets list -->
    <g transform="translate(16, 78)">
      <!-- Set 1 -->
      <rect x="0" y="0" width="336" height="44" rx="6" fill="#161C24" stroke="#2C3644"/>
      <text x="16" y="27" fill="#8892B0" font-family="sans-serif" font-size="13" font-weight="800">S1</text>
      <text x="64" y="27" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="800">80.0 KG</text>
      <text x="168" y="27" fill="#D8DEE9" font-family="sans-serif" font-size="13" font-weight="700">8 POWT.</text>
      
      <rect x="252" y="8" width="72" height="28" rx="4" fill="#1A3326" stroke="#2E7D32"/>
      <text x="288" y="26" fill="#4CAF50" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">ZALICZONO</text>

      <!-- Set 2 -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="336" height="44" rx="6" fill="#161C24" stroke="#2C3644"/>
        <text x="16" y="27" fill="#8892B0" font-family="sans-serif" font-size="13" font-weight="800">S2</text>
        <text x="64" y="27" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="800">85.0 KG</text>
        <text x="168" y="27" fill="#D8DEE9" font-family="sans-serif" font-size="13" font-weight="700">8 POWT.</text>
        
        <rect x="252" y="8" width="72" height="28" rx="4" fill="#1A3326" stroke="#2E7D32"/>
        <text x="288" y="26" fill="#4CAF50" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="800">ZALICZONO</text>
      </g>

      <!-- Set 3 (Active) -->
      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="336" height="44" rx="6" fill="#261A14" stroke="#FF5722" stroke-width="1.5"/>
        <text x="16" y="27" fill="#FF5722" font-family="sans-serif" font-size="13" font-weight="900">S3</text>
        <text x="64" y="27" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="900">90.0 KG</text>
        <text x="168" y="27" fill="#FF8A65" font-family="sans-serif" font-size="13" font-weight="800">6 CEL</text>
        
        <rect x="240" y="8" width="84" height="28" rx="4" fill="url(#copperGrad)"/>
        <text x="282" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="900">ZATWIERDŹ</text>
      </g>
    </g>
  </g>

  <!-- Heavy Duty Action Button -->
  <g transform="translate(26, 582)">
    <rect x="0" y="0" width="368" height="54" rx="8" fill="url(#copperGrad)" stroke="#FF8A65" stroke-width="1"/>
    <text x="184" y="33" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="900" letter-spacing="1.5">ROZLICZ I ZAPISZ W HISTORII</text>
  </g>

  <!-- Industrial Bottom Nav -->
  <g transform="translate(26, 756)">
    <rect x="0" y="0" width="368" height="64" rx="12" fill="#181E27" stroke="#333D4B" stroke-width="1.5"/>
    <text x="64" y="38" fill="#FF5722" font-family="sans-serif" font-size="12" font-weight="800">PLANY</text>
    <text x="150" y="38" fill="#717E94" font-family="sans-serif" font-size="12" font-weight="700">SESJA</text>
    <text x="236" y="38" fill="#717E94" font-family="sans-serif" font-size="12" font-weight="700">BAZA</text>
    <text x="316" y="38" fill="#717E94" font-family="sans-serif" font-size="12" font-weight="700">PROFIL</text>
  </g>
</svg>
